; PlatformIO project configuration for Eptoflow ESP32 firmware
; Install PlatformIO: https://platformio.org

[env:esp32dev]
platform  = espressif32
board     = esp32dev
framework = arduino

; Serial monitor
monitor_speed = 115200

; Build flags
build_flags =
    -DARDUINO_ARCH_ESP32
    -DCORE_DEBUG_LEVEL=0

; Dependencies
lib_deps =
    bblanchon/ArduinoJson@^6.21.3

; OTA upload (after initial flash, use this for wireless updates)
; upload_protocol = espota
; upload_port     = <device_ip>
; upload_flags    = --auth=eptoflow_ota_pass

[env:esp32dev_debug]
extends = env:esp32dev
build_flags =
    -DARDUINO_ARCH_ESP32
    -DCORE_DEBUG_LEVEL=4   ; verbose ESP-IDF logs
monitor_speed = 115200
